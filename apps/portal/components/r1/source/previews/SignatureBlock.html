  h(R.SignatureBlock, { legalName: 'Nguyễn Duy Lâm', typedName: 'Nguyễn Duy Lâm', scrolledToEnd: true, signed: true, signedAt: '2026-09-30T10:42:00+07:00', signLabel: 'Ký giấy phép' }))
