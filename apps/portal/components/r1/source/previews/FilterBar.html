<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>FilterBar - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv' }, h(R.FilterBar, { summary: '12 trong 46 thiết bị', active: true, chips: [{ label: 'Tình trạng: Mất kết nối' }, { label: 'Nhà cung cấp: Hạt Âm Devices' }], locale: 'vi' },
  h(R.Select, { label: 'Tình trạng', value: 'off', options: [{ value: 'all', label: 'Tất cả' }, { value: 'on', label: 'Đang phát' }, { value: 'off', label: 'Mất kết nối' }, { value: 'lim', label: 'Chạm giới hạn ngoại tuyến' }, { value: 'stop', label: 'Đã dừng' }], density: 'console', width: 'var(--space-48)' }),
  h(R.Select, { label: 'Nhà cung cấp', value: 'all', options: [{ value: 'all', label: 'Tất cả' }, { value: 'h', label: 'Hạt Âm Devices' }, { value: 's', label: 'Sóng Chín Audio' }, { value: 'p', label: 'Phím Gỗ Audio' }, { value: 'm', label: 'Hạt Mưa Audio' }], density: 'console', width: 'var(--space-48)' })))
  );
</script>
</body>
</html>
