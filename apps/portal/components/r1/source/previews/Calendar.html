<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Calendar - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { flexDirection: 'row', gap: 'var(--space-6)', alignItems: 'flex-start' } },
  h(R.Calendar, { value: '2026-10-03', today: '2026-09-29', min: '2026-09-29' }),
  h(R.Calendar, { value: '2026-09-01', to: '2026-09-14', today: '2026-09-29' }))
  );
</script>
</body>
</html>
