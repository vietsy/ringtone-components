<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Toast - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv' },
  h(R.Toast, { title: 'Đã lưu lịch phát', action: { label: 'Xem lịch' } }, 'Chill tối, thứ Hai đến thứ Sáu, 18:00–22:00 (GMT+7), từ ' + R.format.date('2026-10-03') + '.'),
  h(R.Toast, { family: 'info', title: 'Đang xuất dữ liệu' }, 'Tệp sẽ có trong mục Tải về khi xong. Bạn có thể rời trang này.'),
  h(R.Toast, { family: 'attention', title: 'Chưa gửi được thông báo cho 3 cơ sở', action: { label: 'Xem danh sách' } }),
  h('div', { style: { width: 'var(--container-xs)' } }, h(R.Toast, { title: 'Đã gửi yêu cầu cho cơ sở' }, 'Cơ sở có 5 ngày làm việc để trả lời.')))
  );
</script>
</body>
</html>
