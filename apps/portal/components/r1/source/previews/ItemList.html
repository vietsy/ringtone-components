<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ItemList - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, var(--container-xs)), 1fr))', alignItems: 'start' } },
  h(R.ItemList, { label: 'Bài trong danh sách', reorder: true, items: [{ title: 'Về đi, trời mưa rồi', detail: 'Na Bích' }, { title: 'Nhắn muộn một chút', detail: 'Rinh' }, { title: 'Cứ thong thả thôi', detail: 'Ngân Mộc' }] }),
  h(R.ItemList, { label: 'Tiêu chí qua cổng', density: 'console', items: [{ family: 'positive', title: 'Uỷ quyền của cổng có hiệu lực' }, { family: 'danger', title: 'Đủ người giữ các vai trò bắt buộc', detail: 'Chưa bổ nhiệm chủ sở hữu biểu phí' }, { family: 'attention', title: 'Ngưỡng tách nhiệm dùng mặc định an toàn' }] }),
  h(R.ItemList, { label: 'Cơ sở trong chuỗi', density: 'portal', items: [
    { title: 'Then Cửa Bakery – Hai Bà Trưng', detail: '86 m², quán bánh', actions: [{ label: 'Gỡ', ariaLabel: 'Gỡ Then Cửa Bakery – Hai Bà Trưng khỏi chuỗi' }] },
    { title: 'Then Cửa Coffee & Tea – Pasteur', detail: '96 m², quán cà phê', actions: [{ label: 'Gỡ', ariaLabel: 'Gỡ Then Cửa Coffee & Tea – Pasteur khỏi chuỗi' }] }] }))
  );
</script>
</body>
</html>
