<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>PasswordField - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', alignItems: 'start' } },
  h(R.PasswordField, { label: 'Mật khẩu mới', required: true, value: 'rightone2027', autoComplete: 'new-password', rules: [{ text: 'Ít nhất 12 ký tự', met: true }, { text: 'Có cả chữ và số', met: true }, { text: 'Khác 5 mật khẩu gần nhất', met: false }] }),
  h(R.PasswordField, { label: 'Mật khẩu', value: 'mây sông 1957', revealed: true }),
  h(R.PasswordField, { label: 'Mật khẩu hiện tại', required: true, value: '', error: 'Nhập mật khẩu hiện tại để đặt mật khẩu mới.' }))
  );
</script>
</body>
</html>
