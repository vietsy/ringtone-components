<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ShareSplit - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', alignItems: 'start', gap: 'var(--space-8)' } },
  h(R.ShareSplit, { legend: 'Quyền tác giả: Hẹn thứ Bảy', helper: 'Tỉ lệ của mỗi người trong phần quyền tác giả.', parties: [{ name: 'Phan Gia Huy', detail: 'Sáng tác', share: 50 }, { name: 'Trần Mỹ Diệp', detail: 'Lời', share: 37.5 }] }),
  h(R.ShareSplit, { legend: 'Quyền liên quan: Hẹn thứ Bảy', readOnly: true, parties: [{ name: 'Vy Sa', detail: 'Trình bày', share: 60 }, { name: 'Võ Duy Khê', detail: 'Sản xuất bản ghi', share: 40 }] }))
  );
</script>
</body>
</html>
