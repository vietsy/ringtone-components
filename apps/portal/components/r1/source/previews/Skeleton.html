<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Skeleton - preview</title>
<style>.pv { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 'var(--space-8)', alignItems: 'start' } },
  h(R.Skeleton, { rows: 3, density: 'console' }),
  h(R.Skeleton, { variant: 'facts', rows: 3 }),
  h(R.Skeleton, { variant: 'card', rows: 2 }),
  h(R.Skeleton, { variant: 'chart', columns: 6 }))
  );
</script>
</body>
</html>
