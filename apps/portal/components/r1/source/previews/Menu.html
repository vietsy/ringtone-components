<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Menu - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { flexDirection: 'row', gap: 'var(--space-12)', alignItems: 'flex-start', minHeight: 'var(--space-72)' } },
  h(R.Menu, { label: 'Thao tác', open: true, items: [
    { label: 'Xuất hồ sơ thiết bị', icon: 'download' }, { label: 'Chuyển sang cơ sở khác', icon: 'arrow-right-left' },
    { label: 'Đổi tình trạng', icon: 'refresh-cw', disabled: true, reason: 'Thiết bị đã báo mất không đổi tình trạng được.' },
    { separator: true }, { label: 'Ngừng dùng PLY-0009', icon: 'power', danger: true } ] }),
  h(R.Menu, { label: 'Cột', icon: 'layout-dashboard', open: true, items: [{ label: 'Thiết bị', checked: true, disabled: true, reason: 'Cột nhận diện luôn hiện.' }, { label: 'Cơ sở', checked: true }, { label: 'Tình trạng', checked: true }, { label: 'Nhà cung cấp', checked: false }, { label: 'Kết nối gần nhất', checked: true }] }),
  h(R.Menu, { iconOnly: true, label: 'Thao tác với PLY-0023', variant: 'quiet', items: [{ label: 'Xem thiết bị' }] }))
  );
</script>
</body>
</html>
