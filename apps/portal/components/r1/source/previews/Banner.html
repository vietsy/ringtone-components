<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Banner - preview</title>
<style>.pv { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gap: 'var(--space-3)' } },
  h(R.Banner, { family: 'attention', title: '214 minh chứng đang tạm giữ', actions: [{ label: 'Mở quyết định DSP-0098' }] }, 'IAM thu hồi định danh thiết bị lúc ' + R.format.timestamp('2026-09-12T09:21:00+07:00') + '. Minh chứng từ ' + R.format.timestamp('2026-09-10T14:00:00+07:00') + ' trở đi nằm ngoài phân phối cho tới khi có quyết định DSP-0098.'),
  h(R.Banner, { family: 'neutral', title: 'Chưa đăng ký: loại cơ sở này nằm ngoài giấy phép trực tiếp', code: 'PREMISES_CLASS_OUT_OF_SCOPE' }, 'Giấy phép trực tiếp của RightOne không áp dụng cho loại cơ sở này nên cơ sở không dùng được dịch vụ Player. Phạm vi giấy phép và cách xin phép qua quy trình cấp phép chung có ngay bên dưới.'),
  h(R.Banner, { family: 'positive', title: 'Đã đối soát xong kỳ ' + R.format.period('2026-09-01', '2026-09-30'), onDismiss: function () {} }, '46 thiết bị đã gửi đủ minh chứng.'),
  h(R.Banner, { family: 'info', compact: true }, 'Mất kết nối, nhạc vẫn phát. Còn 18 giờ 12 phút.'),
  h(R.Banner, { family: 'danger', title: 'Chưa ghi nhận được quyết định', code: 'NO_DISPOSITION_GROUND', actions: h(R.Button, { size: 'sm' }, 'Viết căn cứ') }, 'Giải toả hay loại trừ đều cần ghi căn cứ.'),
  h(R.Banner, { family: 'attention', title: 'Hồ sơ RPS-Q4NDT7WZ2K cần giấy phép kinh doanh', density: 'portal', actions: [{ label: 'Bổ sung giấy phép', variant: 'primary' }], onDismiss: function () {} }, 'Hạn bổ sung ' + R.format.date('2026-10-06') + '.'))
  );
</script>
