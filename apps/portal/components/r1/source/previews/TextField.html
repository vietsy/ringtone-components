<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>TextField - preview</title>
<style>.pv { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, var(--container-xs)), 1fr))', alignItems: 'start' } },
  h(R.TextField, { label: 'Mã số thuế', helper: 'Dạng 10 chữ số, hoặc 13 chữ số cho chi nhánh.', required: true, value: '031234567', error: 'Nhập mã số thuế gồm 10 hoặc 13 chữ số.' }),
  h(R.TextField, { label: 'Tên cơ sở', readOnly: true, value: 'Then Cửa Coffee & Tea – Pasteur', provenance: 'registry-sourced', provenanceDetail: 'Cổng ĐKKD, ' + R.format.date('2026-09-17') }),
  h(R.TextField, { label: 'Thời gian tối đa được phát ngoại tuyến', value: '72', suffix: 'giờ', density: 'console', info: 'Không dài hơn giới hạn ngắn nhất trong quyền đã đồng bộ.' }),
  h(R.TextField, { label: 'Địa chỉ', value: '115 Nguyễn Huệ', warning: 'Có thể trùng với một cơ sở đã đăng ký. Đơn vẫn gửi được và sẽ được xem xét.' }),
  h(R.TextField, { label: 'Giới hạn phát ngoại tuyến', value: '72', suffix: 'giờ', disabled: true, disabledReason: 'Chủ sở hữu dịch vụ đặt giới hạn này.' }),
  h(R.TextField, { label: 'Khoá ký webhook', readOnly: true, masked: true, revealable: true, value: 'whsec_9QK2T7MX4PD8RW3N', helper: 'Dùng để kiểm tra thông báo RightOne gửi đến máy chủ của bạn.' }),
  h(R.TextField, { label: 'Số tài khoản nhận tiền', readOnly: true, masked: true, value: '0071 0004 5821 8901' }),
  h(R.TextField, { label: 'Khoá ký webhook mới', masked: true, revealable: true, value: 'whsec_4XR8NK2WQ7', required: true }))
  );
</script>
</body>
</html>
