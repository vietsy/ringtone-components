<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Artwork - preview</title>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  // A stand-in catalogue image (drawn here, no network): a square in the accent with a disc in the accent surface,
  // both read from the semantic tokens. And one that fails to load.
  var tk = getComputedStyle(document.documentElement);
  var img = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="' + tk.getPropertyValue('--accent').trim() + '"/><circle cx="5" cy="5" r="3" fill="' + tk.getPropertyValue('--accent-surface').trim() + '"/></svg>');
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { 'data-theme': 'player', style: { background: 'var(--page)', color: 'var(--on-surface)', padding: 'var(--space-6)', display: 'flex', flexWrap: 'wrap', gap: 'var(--space-6)', alignItems: 'flex-start' } },
  h(R.Artwork, { title: 'Hẹn thứ Bảy', by: 'Vy Sa', size: 160, locale: 'vi' }),
  h(R.Artwork, { title: 'Hẹn thứ Bảy', by: 'Vy Sa', size: 160, state: 'paused', locale: 'vi' }),
  h(R.Artwork, { variant: 'groove', title: 'Để anh nói nốt', size: 160, locale: 'vi' }),
  h(R.Artwork, { src: img, alt: 'Bìa đĩa Để anh nói nốt', size: 160, state: 'paused', locale: 'vi' }),
  h(R.Artwork, { src: 'data:image/png;base64,AAAA', alt: 'Bìa đĩa', size: 160, locale: 'vi' }),
  h(R.Artwork, { state: 'paused', size: 160, locale: 'vi' }))
  );
</script>
</body>
</html>
