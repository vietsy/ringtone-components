<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>AudioPreview - preview</title>
<style>.pv { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv', style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', alignItems: 'start' } },
  h(R.AudioPreview, { title: 'Hẹn thứ Bảy', by: 'Vy Sa', duration: 238, elapsed: 42, clip: 'Đoạn nghe thử 30 giây, từ 0:30' }),
  h(R.AudioPreview, { title: 'Chín giờ tan ca', by: 'Rinh', duration: 201, elapsed: 118, playing: true }),
  h(R.AudioPreview, { title: 'Khẽ thôi, phố ngủ rồi', by: 'Ngân Mộc', unavailable: true }),
  h(R.AudioPreview, { title: 'Nhắn muộn một chút', by: 'Rinh', duration: 186, error: true }))
  );
</script>
</body>
</html>
