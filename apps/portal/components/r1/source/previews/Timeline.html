<script>

  { id: 'c4', kind: 'correction', corrects: 'c2', title: 'Đính chính thời điểm kích hoạt', at: '2026-02-03T10:12:00+07:00', actor: 'Lê Đăng Quý, vận hành' },

</script>
</body>
</html>
