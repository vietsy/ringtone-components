<!-- @dsCard group="Status" height=80 -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>StatusIcon - preview</title>
<style>.pv { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.R1, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'pv' }, ['positive','attention','danger','neutral','info'].map(function (f) {
  return h('span', { key: f, style: { color: 'var(--' + f + '-text)', display: 'inline-flex', gap: 'var(--space-2)', alignItems: 'center', fontSize: 'var(--text-sm)' } }, h(R.StatusIcon, { family: f, size: 24 }), f);
}).concat([h('span', { key: 's', style: { color: 'var(--accent)', display: 'inline-flex', gap: 'var(--space-2)', alignItems: 'center', fontSize: 'var(--text-sm)' } }, h(R.StatusIcon, { family: 'seal', size: 24 }), 'seal')]))
  );
</script>
</body>
</html>
