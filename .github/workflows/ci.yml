name: ci

on:
  pull_request:
  push:
    branches: [main]
  # rightone-api tells this repository when the contract changes, so the portal builds against it
  # immediately rather than at the next unrelated change here.
  repository_dispatch:
    types: [contract-updated]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # Ephemeral self-hosted runners on node-21 (platform-infra ADR-0024): GitHub-hosted minutes on
    # the Free plan run out, self-hosted ones are not counted. One job per runner, wiped slot.
    runs-on: [self-hosted, linux, x64, plw-sandbox]
    # A download that stalls on the office uplink never fails on its own; the job gives the
    # slot back instead (platform-infra runbook ci-runners, "A job hangs").
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The token sources are generated from the R1 copy; a hand edit or a stale copy fails here.
      - run: pnpm --filter @rightone/tokens generate:check
      # The workspace packages export their types from dist/, which is not committed. On a clean
      # checkout every @rightone/* import is unresolved until they are built, and eslint reports
      # each use as an unsafe call: 40 errors on code that has none.
      - run: pnpm -r --filter "./packages/*" build
      # Next's typed routes live in apps/portal/.next/types, which a clean checkout does not have; without
      # them the type-aware lint reads the casts in lib/routes.ts as unnecessary.
      - run: pnpm --filter @rightone/portal exec next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: a readme in every directory
        run: |
          missing=$(find . -type d \
            -not -path './.git*' -not -path '*/node_modules*' -not -path '*/.next*' \
            -not -path '*/dist' -not -path '*/dist/*' \
            -not -path './.github/*' -not -name '.github' \
            | while read -r d; do [ -f "$d/README.md" ] || echo "$d"; done)
          if [ -n "$missing" ]; then echo "directories without README.md:"; echo "$missing"; exit 1; fi

  secrets:
    name: secrets-scan
    # Ephemeral self-hosted runners on node-21 (platform-infra ADR-0024): GitHub-hosted minutes on
    # the Free plan run out, self-hosted ones are not counted. One job per runner, wiped slot.
    runs-on: [self-hosted, linux, x64, plw-sandbox]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks CLI, not gitleaks-action: the action refuses to run in an organisation without
      # a paid licence key, so this gate was red on every run. The CLI is the same scanner, pinned
      # to a release and checked against its published SHA-256. Full history, findings redacted.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

# Accessibility and performance gates run against a real page, so they belong with Playwright in
# e2e/ rather than here: axe-core on each surface, and Lighthouse against the per-route budgets
# with public verification held to 300 KB. Both open with the first screen specification.
